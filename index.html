<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image Gallery</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: black;
      font-family: Arial, sans-serif;
      color: white;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .gallery a {
      display: block;
      overflow: hidden;
      border-radius: 12px;
      transition: transform 0.3s ease;
    }

    .gallery a:hover {
      transform: scale(1.05);
    }

    .gallery img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border: 2px solid white;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <h1>Bilderatlas Mnemosyne</h1>
